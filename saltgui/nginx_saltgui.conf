server {
    listen 80;
    server_name _;

    root /home/akmod/code/SaltGUI/saltgui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to salt-api
    location /api/ {
        proxy_pass http://localhost:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /login {
        proxy_pass http://localhost:3333/login;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /logout {
        proxy_pass http://localhost:3333/logout;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /stats {
        proxy_pass http://localhost:3333/stats;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /events {
        proxy_pass http://localhost:3333/events;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
}

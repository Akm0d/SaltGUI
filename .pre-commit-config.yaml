repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files


- repo: local
  hooks:
    - id: eslint
      name: eslint
      entry: npm run eslint
      language: system
      types: [javascript]
    - id: prettier
      name: prettier
      entry: npm run format
      language: system
      types: [javascript, css, html, markdown]
